<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>XAUUSD DESK · 5217539</title>
  <style>body{background:#050505;color:#c9a227}</style>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div id="hud">
    <header id="hdr">
      <div class="hdr-l">
        <b>XAUUSD DESK</b>
        <span class="sep">·</span>
        <span id="acct">5217539</span>
        <span class="sep">·</span>
        <span id="live" class="pill stale">STALE</span>
        <span id="hold" class="pill hold">HORMUZ HOLD</span>
      </div>
      <div class="hdr-r">
        <span id="bidlab" class="cyan">—</span>
        <span class="sep">·</span>
        <span id="asof">—</span>
      </div>
    </header>

    <section id="book">
      <div class="k">FLOAT</div>
      <div id="float" class="huge">—</div>
      <div class="meta">
        <div class="row"><span>equity</span><b id="eq">—</b></div>
        <div class="row"><span>balance</span><b id="bal">—</b></div>
      </div>
      <div class="bars">
        <div class="bar-row">
          <div class="bar-lab"><span>LOTTERY</span><b id="lotShare">—</b></div>
          <div class="track"><i id="lotBar"></i></div>
        </div>
        <div class="bar-row">
          <div class="bar-lab"><span>LEFTOVER</span><b id="leftShare">—</b></div>
          <div class="track"><i id="leftBar"></i></div>
        </div>
      </div>
      <div id="bookFoot" class="foot warn">Do not flatten 102034139</div>
    </section>

    <section id="tape">
      <div class="k">TAPE</div>
      <div class="tape-wrap">
        <canvas id="tape-cv"></canvas>
        <div id="tape-lab" class="cyan"></div>
      </div>
    </section>

    <section id="lvls">
      <div class="k">LEVELS</div>
      <div id="levelGrid"></div>
    </section>

    <section id="path">
      <div class="k">PATH · PROJECTION</div>
      <div id="pathSvg"></div>
    </section>

    <section id="kpis"></section>

    <section id="mat">
      <div class="k">LEFTOVER vs LOTTERY $</div>
      <div id="matGrid"></div>
    </section>

    <section id="flow">
      <div class="k">FLOW</div>
      <div id="flowSvg"></div>
    </section>

    <footer id="tick">
      <div id="ticker"></div>
    </footer>
  </div>
  <script src="app.js?v=2"></script>
</body>
</html>
